    <title>童年小梦《新枫之谷》台服下载</title>
    <style>
        :root {
            --primary: #6C5CE7;
            --primary-light: #8C7DF7;
            --secondary: #00B894;
            --dark-bg: #121212;
            --card-bg: #1E1E1E;
            --text-primary: #FFFFFF;
            --text-secondary: #B0BEC5;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            background-image:
                radial-gradient(circle at 20% 50%, rgba(108, 92, 231, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 80% 30%, rgba(0, 184, 148, 0.05) 0%, transparent 30%);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 2rem 0;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            padding: 2rem 1.5rem;
            border-radius: 12px;
            background: rgba(30, 30, 30, 0.6);
            backdrop-filter: blur(10px);
            box-shadow: var(--shadow);
        }

        .date-display {
            color: var(--text-secondary);
            margin-bottom: 1.2rem;
            font-size: 1.1rem;
            font-weight: 300;
        }

        h1 {
            font-size: 1.6rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(90deg, var(--primary-light), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            line-height: 1.4;
        }

        .subtitle {
            color: var(--text-secondary);
            font-weight: 400;
            font-size: 1rem;
        }

        .section-title {
            font-size: 1.3rem;
            margin: 2.5rem 0 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--primary);
            display: inline-block;
        }

        .full-client-container {
            width: 100%;
            margin-bottom: 1rem;
        }

        .full-client-card {
            width: 100%;
        }

        .patch-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }

        @media (min-width: 768px) {
            .patch-container {
                grid-template-columns: repeat(2, 1fr);
            }
            h1 {
                font-size: 2.2rem;
            }
        }

        @media (min-width: 1024px) {
            .patch-container {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .download-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: var(--shadow);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(108, 92, 231, 0.1);
        }

        .download-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            transform: scaleX(0);
            transition: var(--transition);
        }

        .download-card:hover {
            transform: translateY(-5px);
            border-color: rgba(108, 92, 231, 0.3);
        }

        .download-card:hover::before {
            transform: scaleX(1);
        }

        .download-type {
            position: absolute;
            top: 1rem;
            right: 1rem;
            font-size: 0.8rem;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            background-color: rgba(108, 92, 231, 0.2);
            color: var(--primary-light);
        }

        .download-type.full {
            background-color: rgba(0, 184, 148, 0.2);
            color: var(--secondary);
        }

        .download-name {
            font-size: 1.2rem;
            margin-bottom: 1rem;
            padding-right: 4rem;
        }

        .download-info {
            margin-bottom: 1.5rem;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .download-size {
            display: inline-block;
            margin-right: 1rem;
            padding-left: 1.2rem;
            position: relative;
        }

        .download-size::before {
            content: '📦';
            position: absolute;
            left: 0;
        }

        .download-btn {
            display: inline-block;
            width: 100%;
            padding: 0.8rem;
            background: linear-gradient(90deg, var(--primary), var(--primary-light));
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
            text-decoration: none;
        }

        .download-btn:hover {
            background: linear-gradient(90deg, var(--primary-light), var(--primary));
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(108, 92, 231, 0.4);
        }

        footer {
            text-align: center;
            margin-top: 4rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
            padding: 1rem;
        }

        .fade-in {
            animation: fadeIn 0.6s ease forwards;
            opacity: 0;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .loading, .error {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-secondary);
            font-size: 1.2rem;
        }

        .loading-spinner {
            border: 4px solid rgba(108, 92, 231, 0.1);
            border-left-color: var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1.5rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="date-display" id="current-date"></div>
            <h1>童年小梦《新枫之谷》游戏下载</h1>
            <p class="subtitle">台服官方客户端/更新补丁最新下载</p>
        </header>

        <div id="download-container">
            <div class="loading" id="loading">
                <div class="loading-spinner"></div>
                <p>正在获取下载列表...</p>
            </div>

            <div class="error" id="error" style="display: none;">
                <p>获取下载列表失败，请稍后重试</p>
            </div>

            <div id="full-client-section"></div>
            <div id="patch-section"></div>
        </div>

        <footer>
            <p>© 2025 童年小梦 - 所有资源均来自官方渠道</p>
        </footer>
    </div>

    <script>
        function setCurrentDate() {
            const dateElement = document.getElementById('current-date');
            const now = new Date();
            const options = {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                weekday: 'long'
            };
            const formattedDate = now.toLocaleDateString('zh-TW', options);
            dateElement.textContent = formattedDate;
        }

        function setCurrentYear() {
            const footerText = document.querySelector('footer p');
            const currentYear = new Date().getFullYear();
            footerText.textContent = footerText.textContent.replace('2025', currentYear);
        }

        function renderDownloadList(downloadData) {
            const fullClients = downloadData.filter(item => item.type === 1);
            const patches = downloadData.filter(item => item.type === 2);

            const fullClientSection = document.getElementById('full-client-section');
            const patchSection = document.getElementById('patch-section');
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');

            loading.style.display = 'none';
            error.style.display = 'none';

            if (fullClients.length > 0) {
                fullClientSection.innerHTML = `
                    <h2 class="section-title">完整客户端</h2>
                    <div class="patch-container"></div>
                `;
                const fullClientContainer = fullClientSection.querySelector('.patch-container');

                fullClients.forEach((item, index) => {
                    const card = document.createElement('div');
                    card.className = 'download-card full-client-card fade-in';
                    card.style.animationDelay = `${0.1 + index * 0.1}s`;

                    card.innerHTML = `
                        <span class="download-type full">完整客户端</span>
                        <h3 class="download-name">${item.name}</h3>
                        <div class="download-info">
                            <span class="download-size">大小: ${item.size}</span>
                        </div>
                        <a href="${item.point}" class="download-btn" download>立即下载</a>
                    `;

                    fullClientContainer.appendChild(card);
                });
            }

            if (patches.length > 0) {
                patchSection.innerHTML = `
                    <h2 class="section-title">更新补丁</h2>
                    <div class="patch-container"></div>
                `;
                const patchContainer = patchSection.querySelector('.patch-container');

                patches.forEach((item, index) => {
                    const card = document.createElement('div');
                    card.className = 'download-card fade-in';
                    card.style.animationDelay = `${0.1 + index * 0.1}s`;

                    card.innerHTML = `
                        <span class="download-type">更新补丁</span>
                        <h3 class="download-name">${item.name}</h3>
                        <div class="download-info">
                            <span class="download-size">大小: ${item.size}</span>
                        </div>
                        <a href="${item.point}" class="download-btn" download>立即下载</a>
                    `;

                    patchContainer.appendChild(card);
                });
            }
        }

        async function fetchDownloadData() {
            try {
                const response = await fetch('/maple_story/download_url');

                if (!response.ok) {
                    throw new Error('网络响应不正常');
                }

                const data = await response.json();

                if (data.status === 'success' && data.data && data.data.listData) {
                    renderDownloadList(data.data.listData);
                } else {
                    throw new Error('数据格式不正确');
                }
            } catch (error) {
                console.error('获取数据失败:', error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            setCurrentDate();
            setCurrentYear();
            fetchDownloadData();

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.style.opacity = 1;
                        entry.target.style.transform = 'translateY(0)';
                    }
                });
            }, { threshold: 0.1 });

            const observeCards = setInterval(() => {
                const cards = document.querySelectorAll('.download-card');
                if (cards.length > 0) {
                    cards.forEach(card => observer.observe(card));
                    clearInterval(observeCards);
                }
            }, 100);
        });
    </script>
</body>
</html>
